services:
  # ---------- Microsserviços ----------
  wallet-app:
    build: ./wallet-core
    container_name: wallet-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql-wallet
      DB_PORT: "3306"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql-wallet:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  balance-app:
    build: .
    container_name: balance-app
    ports:
      - "3003:3003"
    environment:
      DB_HOST: mysql-balance
      DB_PORT: "3306"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql-balance:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  # ---------- Bancos (um por microsserviço) ----------
  mysql-wallet:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ms-wallet
    ports:
      - "3306:3306"
    volumes:
      - ./wallet-core/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -proot -e 'SELECT 1 FROM accounts LIMIT 1' ms-wallet"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mysql-balance:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: balance
    ports:
      - "3307:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -proot -e 'SELECT 1 FROM accounts LIMIT 1' balance"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---------- Kafka ----------
  zookeeper:
    image: "confluentinc/cp-zookeeper:6.1.0"
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      TZ: America/Sao_Paulo
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: "confluentinc/cp-enterprise-kafka:6.1.0"
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      TZ: America/Sao_Paulo
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 100
      CONFLUENT_METRICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init:
    image: confluentinc/cp-enterprise-kafka:6.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic balances --partitions 1 --replication-factor 1

  control-center:
    image: confluentinc/cp-enterprise-control-center:6.1.0
    hostname: control-center
    container_name: control-center
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: "kafka:29092"
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021